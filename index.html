<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Enroll Now</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body style="background: linear-gradient(135deg, #e8edf7, #f8f1df, #e3eaf4); font-family: 'Poppins', sans-serif;">

    <nav class="navbar shadow" style="background: linear-gradient(90deg, #102c54, #244b78);">
        <div class="container">

            <div class="d-flex align-items-center">
                <img src="https://storage.googleapis.com/oa_disk001/obmconline/2/school_logo/1660181977-833.png" width="55" height="55" alt="School Logo">

                <a class="navbar-brand ms-2 text-white fw-bold" href="#" style="font-family: 'Montserrat'; letter-spacing: 1px;">Enroll Now</a>
            </div>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn fw-semibold" type="submit" style="background-color: #e8b84b; color: #102c54;">Search</button>
            </form>

        </div>
    </nav>

    <div class="container mt-3">
        <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/9804865a-f6de-47d0-b463-c569491b9621/OBMC+MONTESSORI+FV+1+-+AY+2026+FA.jpg" class="img-fluid w-100 shadow rounded" alt="School Banner">
    </div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="shadow p-4 rounded-4" style="background-color: #ffffff; border-top: 6px solid #d9a52e;">

                    <h1 class="text-center fw-bold" style="font-family: 'Montserrat'; color: #102c54;">OBMC Enrollment</h1>
                    <h2 class="text-center mb-4" style="font-family: 'Poppins'; font-size: 19px; color: #b18427; font-weight: 600;">Student Enrollment Form</h2>

                    <form>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-semibold" style="color: #243b59;">First Name</label>
                                <input type="text" class="form-control" placeholder="First Name">
                            </div>

                            <div class="col">
                                <label class="form-label fw-semibold" style="color: #243b59;">Last Name</label>
                                <input type="text" class="form-control" placeholder="Last Name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Birth Date</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Gender</label>
                            <select class="form-control">
                                <option>Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Grade Level</label>
                            <select class="form-control">
                                <option>Select Grade</option>
                                <option>Grade 7</option>
                                <option>Grade 8</option>
                                <option>Grade 9</option>
                                <option>Grade 10</option>
                                <option>Grade 11</option>
                                <option>Grade 12</option>
                            </select>
                        </div>

                        <h2 class="mt-4 mb-3 fw-bold" style="font-family: 'Montserrat'; font-size: 20px; color: #102c54;">Contact Details</h2>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter Email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Contact Number</label>
                            <input type="tel" class="form-control" placeholder="Enter Contact Number">
                        </div>

                        <h2 class="mt-4 mb-3 fw-bold" style="font-family: 'Montserrat'; font-size: 20px; color: #102c54;">Other Information</h2>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Home Address</label>
                            <input type="text" class="form-control" placeholder="Enter Address">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #243b59;">Additional Information</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold" style="background: linear-gradient(90deg, #102c54, #28558a); border: none; border-radius: 8px;">Submit Enrollment</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <footer class="text-white text-center p-4 mt-4" style="background: linear-gradient(90deg, #102c54, #244b78);">
        <p class="fw-bold mb-2" style="font-family: 'Montserrat';">OBMC | Student Enrollment</p>
        <p class="mb-2" style="color: #e5d5ad;">Official School Website</p>
        <p class="mb-0" style="font-size: 13px;">© 2026 All Rights Reserved</p>
    </footer>

</body>
</html>
